# Реестр источников трендвотчера конкурентов.
# Источник правды для парсера. Таблица competitor_feeds.xlsx — та же карта для чтения глазами;
# при расхождении верен этот файл.
#
# Статусы:
#   ok        — адрес проверен, лента отдаёт то, что ожидалось
#   candidate — адрес выведен из шаблона и не подтверждён, проверка описана в backlog
#   blocked   — адрес верен, но доступ закрыт (см. blocked_by)
#   none      — источника нет, дыра зафиксирована осознанно

version: 1
updated: 2026-10-14

defaults:
  user_agent: "trendwatcher/1.0 (kostik80_80@mail.ru)"
  schedule: "Mon 09:00 Europe/Moscow"
  timeout_sec: 30
  retries: 2

hh:
  # Анонимный доступ к api.hh.ru закрыт: 403 {"errors":[{"type":"forbidden"}]}.
  # Токен приложения: POST https://api.hh.ru/token, grant_type=client_credentials.
  # Срок жизни неограниченный, повторный запрос отзывает прежний токен,
  # запрашивать не чаще раза в 5 минут => получать вручную, в парсере только читать из env.
  token_url: "https://api.hh.ru/token"
  grant_type: client_credentials
  token_env: HH_APP_TOKEN
  app_status: pending_moderation       # заявка подана 2026-10-14
  auth_header: "Authorization: Bearer {token}"

# Группы дедупликации: одна и та же статья может прийти из двух источников
# (свой сайт + Хабр). Событие создаётся один раз на группу.
dedup_groups:
  kts_articles:        [kts_blog_site, kts_blog_habr]
  simbirsoft_articles: [simbirsoft_blog_habr, simbirsoft_blog_site]
  agima_articles:      [agima_blog_habr, agima_blog_site]

