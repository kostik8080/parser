  - id: justai_site
    company: Just AI
    kind: site
    method: sitemap_index
    url: "https://just-ai.com/sitemap.xml"
    status: ok
    # У Just AI тип страницы определяется не путём, а дочерней картой, из которой пришёл URL
    classify_by_child:
      blog-sitemap.xml:      article
      case-sitemap.xml:      case
      page-sitemap.xml:      new_page
      solutions-sitemap.xml: new_page
      category-sitemap.xml:  noise
    default_signal: new_page                        # новая дочерняя карта = новый раздел сайта
    # Страницы мероприятий лежат в page-sitemap рядом с продуктовыми — конференции по паспорту шум.
    # Эвристика по slug, проверить на первых прогонах
    exclude_slug_patterns: ["hackathon", "biznes-uzhin", "konferents", "conversations", "webinar", "meetup"]
    track_lastmod_for: [new_page]                   # lastmod у каждого URL свой — грубый сигнал page_changed
    measured: >-
      2026-10-15: блог 187 URL (6 изменены за 90 дней), кейсы 26 (3 новых за 90 дней: Совкомбанк,
      телеком, ИИ-рекрутинг), страницы 45 (12 изменены за 90 дней, в т.ч. /agent-platform-enterprise)
    note: >-
      Значения в CDATA. lastmod = дата правки, не публикации. RSS /feed/ и /blog/feed пустые.
      В блоге встречаются рейтинги и отчёты о конференциях — по паспорту шум (SPEC.md, раздел 4)

