coverage_gaps:

  - company: Softline digital
    verdict: "Белых источников именно по компании нет"
    detail: >-
      Вакансии — только группа целиком (hh 2381). Статьи: блог softline.ru/about/blog
      общегрупповой (1 из 12 свежих статей про ИИ) и доступен только через вёрстку;
      карта сайта устарела (в ней 3 из 12 свежих статей, lastmod массовые);
      блог на Хабре мёртв с 25.02.2022. Всё, что есть, — про группу Softline, а не про digital

  - company: R77 AI
    verdict: "Белых источников практически нет"
    detail: >-
      Вакансий нет ни на hh.ru, ни на сайте; блога на Хабре не найдено.
      Остаётся одна лента кейсов: 2 записи за год, обе одним днём

  - company: red_mad_robot
    verdict: "Живой канал появится только с токеном hh"
    detail: >-
      Хабр на паузе с 2026-07-03, у своего сайта нет карты (SPA), redmadrobot.ru не отвечает.
      До одобрения заявки на dev.hh.ru по компании не приходит ничего

  - company: "все"
    channel: Telegram
    verdict: "Белого источника нет"
    detail: >-
      Паспорт оставляет публикации в Telegram в сводке, но у публичных каналов нет
      машиночитаемой ленты: веб-версия — это HTML, бот не читает чужие каналы,
      клиентский API требует входа под пользовательским аккаунтом

  - company: "все"
    channel: vc.ru
    verdict: "Не проверено"
    detail: "Есть ли у vc.ru машиночитаемая лента по компании — пункт в BACKLOG.md"

  - company: "все"
    signal: page_changed
    verdict: "Только грубо и только у двух компаний"
    detail: >-
      Изменение lastmod у известного URL — сигнал без разбора страницы. Работает у Just AI
      и AGIMA. У Napoleon IT lastmod нет ни у одного URL, у KTS — только у кейсов, не у страниц
      направлений. Отличить правку цены от правки
      баннера без разбора вёрстки нельзя — это ограничение, а не недоделка
